<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的饮食计划 - 个性化饮食健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    <style>
        body {
            padding-top: 4.5rem;
        }
        .plan-card {
            transition: transform 0.2s;
        }
        .plan-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }
        .empty-state-icon {
            font-size: 4rem;
            color: #dee2e6;
            margin-bottom: 1rem;
        }
        .nutrition-chart-small {
            height: 120px;
            width: 120px;
            margin: 0 auto 15px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">个性化饮食健康管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/user/dashboard">控制台</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dietPlan/generate">生成饮食建议</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/dietPlan/plans">我的计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dietPlan/history">历史记录</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <div class="dropdown">
                        <a class="btn btn-outline-light dropdown-toggle" href="#" role="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:text="${session.user.username}">用户名</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="/user/profile">个人信息</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>我的饮食计划</h2>
            <a href="/dietPlan/generate" class="btn btn-success">
                <i class="bi bi-plus-lg"></i> 生成新的饮食建议
            </a>
        </div>

        <!-- 计划列表 -->
        <div class="row" th:if="${not #lists.isEmpty(planList)}">
            <div class="col-md-6 col-lg-4 mb-4" th:each="plan : ${planList}">
                <div class="card plan-card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="badge" th:classappend="${plan.recordType == '计划' ? 'bg-primary' : 'bg-success'}" th:text="${plan.recordType}">类型</span>
                        <span class="text-muted" th:text="${plan.recordDate}">日期</span>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" th:text="${plan.planName}">计划名称</h5>
                        <div class="card-text">
                            <div class="nutrition-chart-small">
                                <canvas th:id="'chart-' + ${plan.recordId}"></canvas>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>总热量:</span>
                                <strong th:text="${plan.totalCalories} + ' 卡路里'">0 卡路里</strong>
                            </div>
                            <div class="small text-muted">
                                <span th:text="'蛋白质: ' + ${plan.totalProtein} + 'g'">蛋白质: 0g</span> · 
                                <span th:text="'脂肪: ' + ${plan.totalFat} + 'g'">脂肪: 0g</span> · 
                                <span th:text="'碳水: ' + ${plan.totalCarbs} + 'g'">碳水: 0g</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent">
                        <div class="d-flex gap-2">
                            <a th:href="@{'/dietPlan/detail/' + ${plan.recordId}}" class="btn btn-sm btn-outline-primary flex-grow-1">查看详情</a>
                            <button th:if="${plan.recordType == '计划'}" 
                                    th:onclick="'convertToLog(' + ${plan.recordId} + ')'" 
                                    class="btn btn-sm btn-outline-success">
                                <i class="bi bi-arrow-right-circle"></i> 转为历史
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 空状态 -->
        <div class="card" th:if="${#lists.isEmpty(planList)}">
            <div class="card-body empty-state">
                <div class="empty-state-icon">
                    <i class="bi bi-calendar-x"></i>
                </div>
                <h4>暂无饮食计划</h4>
                <p class="text-muted">您还没有创建任何饮食计划或记录。</p>
                <a href="/dietPlan/generate" class="btn btn-primary mt-2">
                    生成饮食建议
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-light py-4 mt-5">
        <div class="container">
            <p class="text-center text-muted">© 2025 个性化饮食健康管理系统</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

    <script th:inline="javascript">
        // 初始化所有计划的营养饼图
        document.addEventListener('DOMContentLoaded', function() {
            const plans = /*[[${planList}]]*/ [];

            if (plans && plans.length > 0) {
                plans.forEach(function(plan) {
                    const ctx = document.getElementById('chart-' + plan.recordId);
                    if (ctx) {
                        // 计算营养素所占热量比例
                        const proteinCalories = plan.totalProtein * 4;
                        const fatCalories = plan.totalFat * 9;
                        const carbsCalories = plan.totalCarbs * 4;

                        new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: ['蛋白质', '脂肪', '碳水'],
                                datasets: [{
                                    data: [proteinCalories, fatCalories, carbsCalories],
                                    backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc']
                                }]
                            },
                            options: {
                                maintainAspectRatio: false,
                                cutout: '70%',
                                plugins: {
                                    legend: {
                                        display: false
                                    },
                                    tooltip: {
                                        callbacks: {
                                            label: function(context) {
                                                const dataset = context.dataset;
                                                const total = dataset.data.reduce((previousValue, currentValue) => previousValue + currentValue, 0);
                                                const currentValue = dataset.data[context.dataIndex];
                                                const percentage = Math.floor(((currentValue/total) * 100)+0.5);
                                                return context.chart.data.labels[context.dataIndex] + ': ' + percentage + '%';
                                            }
                                        }
                                    }
                                }
                            }
                        });
                    }
                });
            }
        });

        // 将计划转换为历史记录
        function convertToLog(planId) {
            if (confirm('确定要将此计划转为历史记录吗？')) {
                fetch('/dietPlan/convertToLog/' + planId)
                    .then(response => response.json())
                    .then(data => {
                        if (data) {
                            alert('计划已成功转为历史记录！');
                            // 刷新页面以显示更新后的状态
                            window.location.reload();
                        } else {
                            alert('操作失败，请稍后重试。');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('发生错误，请稍后重试。');
                    });
            }
        }
    </script>
</body>
</html>
