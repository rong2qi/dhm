<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>饮食计划详情 - 个性化饮食健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    <style>
        body {
            padding-top: 4.5rem;
        }
        .meal-card {
            margin-bottom: 1.5rem;
        }
        .food-item {
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }
        .food-item:last-child {
            border-bottom: none;
        }
        .nutrition-chart {
            height: 300px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">个性化饮食健康管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/user/dashboard">控制台</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dietPlan/generate">生成饮食建议</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dietPlan/plans">我的计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dietPlan/history">历史记录</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <div class="dropdown">
                        <a class="btn btn-outline-light dropdown-toggle" href="#" role="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            用户名
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="/user/profile">个人信息</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="${plan.planName}">饮食计划名称</h2>
            <div>
                <span class="badge bg-primary" th:text="${plan.recordType}">计划类型</span>
                <span class="badge bg-secondary" th:text="${plan.recordDate}">日期</span>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <!-- 餐次详情 -->
                <div th:each="meal : ${plan.meals}" class="card meal-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0" th:text="${meal.mealType}">餐次类型</h5>
                        <span th:if="${meal.mealTime != null}" th:text="${meal.mealTime}">时间</span>
                    </div>
                    <div class="card-body">
                        <div th:if="${meal.mealFoods == null || meal.mealFoods.isEmpty()}" class="text-center text-muted py-3">
                            暂无食物
                        </div>
                        <div th:each="mealFood : ${meal.mealFoods}" class="food-item">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <strong th:text="${mealFood.food.name}">食物名称</strong>
                                    <span class="text-muted" th:text="'(' + ${mealFood.food.category} + ')'">类别</span>
                                </div>
                                <div>
                                    <span th:text="${mealFood.servingAmount} + ' ' + ${mealFood.food.servingSize}">份量</span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between text-muted small">
                                <span th:text="${mealFood.food.description}">描述</span>
                                <span th:text="${mealFood.calculatedCalories} + ' 卡路里'">卡路里</span>
                            </div>
                            <div class="d-flex justify-content-between text-muted small">
                                <span>蛋白质: <span th:text="${mealFood.calculatedProtein} + 'g'"></span></span>
                                <span>脂肪: <span th:text="${mealFood.calculatedFat} + 'g'"></span></span>
                                <span>碳水: <span th:text="${mealFood.calculatedCarbs} + 'g'"></span></span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-end">
                        <small class="text-muted">
                            总卡路里: 
                            <span>0 卡路里</span>
                        </small>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <!-- 营养总览 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">营养总览</h5>
                    </div>
                    <div class="card-body">
                        <div class="nutrition-chart">
                            <canvas id="nutritionChart"></canvas>
                        </div>
                        <div class="list-group list-group-flush">
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>总热量:</span>
                                <strong th:text="${plan.totalCalories + ' 卡路里'}">0 卡路里</strong>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>蛋白质:</span>
                                <strong>
                                    <span th:text="${plan.totalProtein + 'g'}">0g</span>
                                    <span th:if="${plan.totalCalories > 0}" th:text="${'(' + #numbers.formatDecimal(plan.totalProtein * 4 / plan.totalCalories * 100, 1, 0) + '%)'}"></span>
                                </strong>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>脂肪:</span>
                                <strong>
                                    <span th:text="${plan.totalFat + 'g'}">0g</span>
                                    <span th:if="${plan.totalCalories > 0}" th:text="${'(' + #numbers.formatDecimal(plan.totalFat * 9 / plan.totalCalories * 100, 1, 0) + '%)'}"></span>
                                </strong>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>碳水化合物:</span>
                                <strong>
                                    <span th:text="${plan.totalCarbs + 'g'}">0g</span>
                                    <span th:if="${plan.totalCalories > 0}" th:text="${'(' + #numbers.formatDecimal(plan.totalCarbs * 4 / plan.totalCalories * 100, 1, 0) + '%)'}"></span>
                                </strong>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">操作</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${plan.recordType == '计划'}" class="d-grid gap-2 mb-3">
                            <button id="convertToLogBtn" class="btn btn-success">转为历史记录</button>
                        </div>
                        <div class="d-grid gap-2">
                            <a href="/dietPlan/plans" class="btn btn-outline-primary">返回列表</a>
                            <button id="deletePlanBtn" class="btn btn-outline-danger">删除</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-4 mt-5">
        <div class="container">
            <p class="text-center text-muted">© 2025 个性化饮食健康管理系统</p>
        </div>
    </footer>

    <!-- Hidden inputs for JavaScript -->
    <input type="hidden" id="plan-id" th:value="${plan.recordId}">
    <input type="hidden" id="record-type" th:value="${plan.recordType}">
    <input type="hidden" id="protein-value" th:value="${plan.totalProtein}">
    <input type="hidden" id="fat-value" th:value="${plan.totalFat}">
    <input type="hidden" id="carbs-value" th:value="${plan.totalCarbs}">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/detail-chart.js"></script>
</body>
</html>
