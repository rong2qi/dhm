<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 个性化饮食健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 3.5rem;
            background-color: #f8f9fa;
        }
        .register-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-icon {
            font-size: 3rem;
            color: #0d6efd;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">个性化饮食健康管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">登录</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/register">注册</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="register-container">
            <div class="register-header">
                <div class="register-icon">📝</div>
                <h2>用户注册</h2>
            </div>
            
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
            
            <form action="/register" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label">用户名 *</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                        <div class="form-text">用户名作为登录账号，不可修改</div>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label">密码 *</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <div class="form-text">密码长度至少6位</div>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label">出生日期</label>
                        <input type="date" class="form-control" id="birthDate" name="birthDate">
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label">性别</label>
                        <select class="form-select" id="gender" name="gender">
                            <option value="" selected>-- 请选择 --</option>
                            <option value="女性">女性</option>
                            <option value="男性">男性</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="height" class="form-label">身高 (cm) *</label>
                        <input type="number" class="form-control" id="height" name="height" step="0.1" min="50" max="250" required>
                    </div>
                    <div class="col-md-6">
                        <label for="activityLevel" class="form-label">活动水平 *</label>
                        <select class="form-select" id="activityLevel" name="activityLevel" required>
                            <option value="慵懒">慵懒（几乎不运动）</option>
                            <option value="轻度活跃" selected>轻度活跃（每周运动1-3次）</option>
                            <option value="中等活跃">中等活跃（每周运动3-5次）</option>
                            <option value="活跃">活跃（每周运动6-7次）</option>
                            <option value="非常活跃">非常活跃（每天高强度运动或体力劳动）</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="healthGoal" class="form-label">健康目标 *</label>
                    <select class="form-select" id="healthGoal" name="healthGoal" required>
                        <option value="减重">减重</option>
                        <option value="维持身材" selected>维持身材</option>
                        <option value="增肌">增肌</option>
                    </select>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">注册</button>
                </div>
            </form>
            
            <div class="mt-3 text-center">
                <p>已有账号？<a href="/login">立即登录</a></p>
            </div>
        </div>
    </main>

    <footer class="bg-light py-4 mt-5">
        <div class="container">
            <p class="text-center text-muted">© 2025 个性化饮食健康管理系统</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
