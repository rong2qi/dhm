<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 个性化饮食健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 4.5rem;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            margin-bottom: 24px;
        }
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .btn-primary {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        .btn-primary:hover {
            background-color: #2e59d9;
            border-color: #2653d4;
        }
        .badge.bg-danger {
            background-color: #e74a3b !important;
        }
        .badge.bg-primary {
            background-color: #4e73df !important;
        }
        .badge.bg-success {
            background-color: #1cc88a !important;
        }
        .table {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">个性化饮食健康管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/users">用户管理</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <div class="dropdown">
                        <a class="btn btn-outline-light dropdown-toggle" href="#" role="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false" th:text="${session.user.username}">
                            管理员
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="/user/profile">个人信息</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>用户管理</h2>
        </div>

        <!-- 搜索和筛选 -->
        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-3" action="/admin/users" method="get">
                    <div class="col-md-4">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username" th:value="${searchUsername}" placeholder="搜索用户名">
                    </div>
                    <div class="col-md-3">
                        <label for="role" class="form-label">角色</label>
                        <select class="form-select" id="role" name="role">
                            <option value="" th:selected="${searchRole == null || searchRole == ''}">全部</option>
                            <option value="user" th:selected="${searchRole == 'user'}">普通用户</option>
                            <option value="admin" th:selected="${searchRole == 'admin'}">管理员</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="status" class="form-label">状态</label>
                        <select class="form-select" id="status" name="status">
                            <option value="" th:selected="${searchStatus == null || searchStatus == ''}">全部</option>
                            <option value="active" th:selected="${searchStatus == 'active'}">活跃</option>
                            <option value="inactive" th:selected="${searchStatus == 'inactive'}">停用</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <button type="submit" class="btn btn-primary w-100">搜索</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 用户列表 -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>性别</th>
                                <th>角色</th>
                                <th>注册时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.userId}">1</td>
                                <td th:text="${user.username}">用户名</td>
                                <td th:text="${user.gender}">性别</td>
                                <td>
                                    <span th:if="${user.role == 'admin'}" class="badge bg-danger">管理员</span>
                                    <span th:if="${user.role == 'user'}" class="badge bg-primary">普通用户</span>
                                </td>
                                <td th:text="${user.createdAt}">2025-01-01</td>
                                <td>
                                    <span class="badge bg-success">活跃</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{'/admin/user/' + ${user.userId}}" class="btn btn-outline-primary">查看</a>
                                        <button type="button" class="btn btn-outline-danger" th:onclick="'deleteUser(' + ${user.userId} + ')'">删除</button>
                                    </div>
                                </td>
                            </tr>
                            <!-- 如果没有用户 -->
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="7" class="text-center">没有找到用户</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-4 mt-5">
        <div class="container">
            <p class="text-center text-muted">© 2025 个性化饮食健康管理系统</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function deleteUser(userId) {
            if (confirm('确定要删除此用户吗？此操作无法撤销。')) {
                fetch('/admin/deleteUser/' + userId)
                    .then(response => response.json())
                    .then(data => {
                        if (data === true) {
                            alert('用户删除成功');
                            location.reload();
                        } else {
                            alert('删除失败，请重试');
                        }
                    })
                    .catch(error => {
                        alert('操作出错：' + error);
                    });
            }
        }
    </script>
</body>
</html>
